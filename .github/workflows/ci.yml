name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenant_toolkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: tenant_app
      PGPASSWORD: postgres
      PGDATABASE: tenant_toolkit_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply schema + RLS policies
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d tenant_toolkit_test -f db/schema.sql

      - name: Give tenant_app a login password (CI's Postgres uses password auth, unlike local trust auth)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d tenant_toolkit_test -c "ALTER ROLE tenant_app WITH PASSWORD 'postgres'"

      - name: Static analysis - fail the build on any raw pg import bypassing TenantPool
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (adversarial RLS suite, pool-reset stress test, lint-check tests, NestJS e2e)
        run: npm test
